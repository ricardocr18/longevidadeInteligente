[project]
name = "vivia-poc"
version = "0.1.0"
description = "Vivia — tutora de saúde conversacional (POC)"
readme = "README.md"
authors = [
    { name = "ricardocr18", email = "ricardocribeiro@hotmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    # Fase 1
    "anthropic>=0.30",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.35",
    # Fase 2 — descomentar quando Fase 1 tiver DoD cumprido
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.2",
    # Fase 3 — descomentar quando Fase 2 tiver DoD cumprido
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "elevenlabs>=1.5",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.scripts]
vivia = "vivia.main:run"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []

[tool.uv.build-backend]
module-name = "vivia"